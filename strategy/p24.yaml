# P24 자산군 정의 — ICB 19개 슈퍼섹터 + 원자재 5개
#
# 결정 근거: docs/brainstorm/2026-09-22-suka-etf-p24.md
# 가격 원천: brent_benfold/data/cybos_crosscheck.db (읽기 전용), overseas_daily_raw
#
# description 은 자막 조각을 자산군에 배정할 때 임베딩하는 설명문이다.
# ICB 정의 + 슈카 방송에서 쓰일 법한 한국어 키워드 + 국내외 대표 기업을 담는다.
# 이 파일은 T8(규칙 동결) 전에만 고칠 수 있다. 동결 후 변경하면 결과를 다시 사전 등록해야 한다.
#
# icb_check: DB 표기명과 ICB 슈퍼섹터의 대응이 이름만으로 확실하면 ok, 가격 상관으로 확인했으면 probed.
#   2026-09-22 점검(2021-05 이후 주간 상관): 금융→미국 증권브로커 0.92, 제조업→중장비 0.80,
#   기초산업→비철금속 0.85, 비순환상품서비스→음식료 0.73·소매 0.72(가장 약함).
# roll: 선물 연결 시계열의 월물 교체 조정 필요 여부.
# source: 생략하면 overseas_daily_raw(달러), kr_etf 면 daily_ohlcv(원화 상장 ETF).
#
# 주간 시점 규약: 주 t 신호는 한국시간 목요일 23:59 까지 게시된 영상만 쓰고,
# 금요일 종가에 포지션을 잡아 다음 금요일 종가까지 보유한다(strategy/price_panel.py 참조).

version: 2
currency: USD

# "해당 없음" 닻. 조각이 어떤 자산군보다 이 설명문에 더 가까우면 배정하지 않는다(T7, 2026-09-22).
# 기준값 하나로 거르면 방송 진행 멘트·역사 이야기가 가장 덜 먼 자산군(미디어 등)으로 끌려간다.
null_anchors:
  - id: NULL_HOST
    description: >-
      방송 진행 멘트. 인사, 다음 주제로 넘어가기, 구독과 좋아요, 댓글 읽기, 라이브 방송 잡담,
      오늘 준비한 이야기, 시청자 질문, 광고 안내, 채널 소식, 농담과 잡담.
  - id: NULL_HISTORY
    description: >-
      역사와 인물 이야기. 과거 전쟁사, 왕조, 역사적 사건의 전개, 옛날 인물의 일화, 고대사,
      근현대사의 비극, 민족과 이주의 역사.
  - id: NULL_SOCIETY
    description: >-
      사회 이슈. 저출산, 교육, 학교, 입시, 범죄, 사건 사고, 세대 갈등, 젠더, 복지 제도,
      민원, 지역 소멸, 문화와 생활 습관.
  - id: NULL_POLITICS
    description: >-
      정치 일반. 선거, 정당, 국회, 대통령 지지율, 외교 의전, 정치인 발언, 법안 논쟁,
      국제 정치의 권력 다툼과 정상회담.
  - id: NULL_SCIENCE
    description: >-
      과학과 자연 이야기. 동물, 생태계, 우주, 공룡, 인체, 기후 현상 설명, 과학 상식.
